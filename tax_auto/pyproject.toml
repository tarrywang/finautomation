[project]
name = "tax-auto"
version = "0.1.0"
description = "Self-built invoice automation for Shanghai e-tax bureau · Playwright + Claude vision fallback"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "TarryAI", email = "tarryesc@gmail.com" }]
license = { text = "Proprietary" }

dependencies = [
    "playwright>=1.49,<1.50",
    "anthropic>=0.40",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlmodel>=0.0.22",
    "loguru>=0.7",
    "typer>=0.13",
    "keyring>=25.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "ulid-py>=1.1",
    "pyyaml>=6.0",
    # 发票通 warehouse (Postgres) + web frontend
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "itsdangerous>=2.2",
    "bcrypt>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml",
]
ofd = [
    # OFD/PDF parsing — installed in W5 when needed
    "easyofd>=0.5",
    "pdfplumber>=0.11",
]

[project.scripts]
tax-auto = "tax_auto.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tax_auto"]

# ───────────────────────────── Tooling ──────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    # Legacy Playwright-era code; not under active CI gate. Migrate later.
    "tax_auto/cli.py",
    "tax_auto/core/state_machine.py",
    "scripts/recon.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # FastAPI's Query(...) / Depends(...) in defaults — idiomatic, not a bug
    "RUF001", # ambiguous Unicode in strings — we have lots of Chinese/CJK
    "RUF002", # ambiguous Unicode in docstrings
    "RUF003", # ambiguous Unicode in comments
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that need real browser / network",
    "smoke: weekly smoke tests against real tax bureau",
]
