name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:  # 也可以手动触发

concurrency:
  group: deploy
  cancel-in-progress: false   # 部署中别打断

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/fapiao-app

jobs:
  build-and-push:
    name: Build + push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write       # GHCR push
    outputs:
      image_tag: ${{ steps.meta.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          SHA=${GITHUB_SHA::7}
          echo "short_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$SHA,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_OUTPUT"

      - name: Build + push
        uses: docker/build-push-action@v5
        with:
          context: ./tax_auto
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Trust the server's host key
          ssh-keyscan -p ${{ secrets.SSH_PORT || '22' }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync code to server
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -az --delete \
            --exclude='_data/' \
            --exclude='.env' \
            --exclude='.git/' \
            --exclude='rawdata/' \
            --exclude='*.html' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || '22' }} -o StrictHostKeyChecking=accept-new" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$DEPLOY_PATH/

      - name: Pull image + restart on server
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || '22' }} \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "set -e
               cd $DEPLOY_PATH

               # Log in to GHCR (uses a token the server has stored once);
               # if first run, you need to:
               #   echo \$GHCR_PAT | docker login ghcr.io -u tarrywang --password-stdin

               # Pin the image to this commit's SHA, so we can roll back easily
               export FAPIAO_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$IMAGE_TAG

               # Pull both this tag and latest
               docker pull \$FAPIAO_IMAGE
               docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

               # Force rebuild the app image from current source.
               # (compose.prod.yml uses `build:` not `image:`, so without
               # --build it'd silently keep using the stale cached image.)
               docker compose -f compose.prod.yml build app
               docker compose -f compose.prod.yml up -d --force-recreate --no-deps app

               # Cleanup older images (keep 3)
               docker image prune -f --filter 'until=168h' || true
              "

      - name: Health check
        env:
          HEALTH_URL: ${{ secrets.HEALTHCHECK_URL || 'http://localhost:8000/healthz' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || '22' }} \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "set -e
               echo '── 等 30 秒让 app 起来'
               sleep 30
               for i in 1 2 3 4 5; do
                 if curl -fsS http://127.0.0.1:8000/healthz | grep -q ok; then
                   echo '✓ app healthz OK'
                   exit 0
                 fi
                 echo 'attempt '\$i' failed, retrying in 5s'
                 sleep 5
               done
               echo '✗ healthz never returned ok'
               docker compose -f ${{ secrets.DEPLOY_PATH }}/compose.prod.yml logs app --tail 50
               exit 1
              "

      - name: Cleanup local SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
