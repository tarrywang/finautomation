# /etc/nginx/sites-available/fapiao.conf
#
# Replace fapiao.example.com with your real domain.
# After saving:
#   sudo ln -s /etc/nginx/sites-available/fapiao.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d fapiao.example.com           # gets cert + auto-rewrites this file
#   sudo nginx -t && sudo systemctl reload nginx

# ── Redirect HTTP → HTTPS ─────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name fapiao.example.com;

    # Let's Encrypt webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS reverse proxy ───────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fapiao.example.com;

    # Filled in by certbot; remove these lines if you'd rather manage manually
    ssl_certificate     /etc/letsencrypt/live/fapiao.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fapiao.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers (FastAPI adds X-Frame-Options + Referrer-Policy too;
    #    duplicates are harmless) ─────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Reasonably strict CSP — Tailwind CDN / Chart.js / Alpine / HTMX from CDNs allowed
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # Block hidden file requests, etc.
    location ~ /\.(git|env|DS_Store) { deny all; }

    # ── Login endpoint extra rate-limit (10 req/min per IP) ─────────────
    location = /login {
        limit_req zone=fapiao_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/conf.d/fapiao_proxy_params.inc;
    }

    # ── Everything else ─────────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/conf.d/fapiao_proxy_params.inc;
    }

    # Limit body to 5 MB
    client_max_body_size 5M;

    # Logging
    access_log /var/log/nginx/fapiao.access.log;
    error_log  /var/log/nginx/fapiao.error.log warn;
}
